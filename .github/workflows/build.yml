name: Build and Release ESP32-C6 Firmware

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Автоматически передаем версию из тега в CMake
      - name: Set project version from tag
        run: echo "PROJECT_VER=${{ github.ref_name }}" | sed 's/v//' >> $GITHUB_ENV
          
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          target: esp32c6
          # Передаем переменную в контейнер сборки
          command: "idf.py -DPROJECT_VER=${{ env.PROJECT_VER }} build"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c6
          path: build/*.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/sample_project_cpp.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}